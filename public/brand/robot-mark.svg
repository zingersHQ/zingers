  <!-- antenna -->
  <circle cx="16" cy="3.5" r="2.8" fill="#e8e4d8"/>
  <rect x="13.6" y="4" width="4.8" height="5" rx="2.2" fill="#e8e4d8"/>
  <!-- head -->
  <rect x="2.5" y="7.5" width="27" height="22" rx="6" fill="#e8e4d8"/>
  <!-- eyes (cutouts) -->
  <rect x="6.5" y="12.5" width="6.5" height="7.5" rx="2" fill="#0a0912"/>
  <rect x="19" y="12.5" width="6.5" height="7.5" rx="2" fill="#0a0912"/>
  <!-- mouth -->
  <rect x="11" y="23" width="10" height="2.8" rx="1.4" fill="#0a0912"/>
</svg>
